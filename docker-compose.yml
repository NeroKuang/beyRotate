# 本機開發：只跑 Postgres + MinIO（Next.js 用 npm run dev）
# 正式環境請用 Zeabur 部署 Dockerfile，不要用此檔的 app 服務

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beyrotate
      POSTGRES_PASSWORD: beyrotate_dev
      POSTGRES_DB: beyrotate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beyrotate -d beyrotate"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: beyrotate
      MINIO_ROOT_PASSWORD: beyrotate_dev_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      sleep 4;
      mc alias set local http://minio:9000 beyrotate beyrotate_dev_minio;
      mc mb local/listing-images --ignore-existing;
      mc mb local/avatars --ignore-existing;
      mc anonymous set download local/listing-images;
      mc anonymous set download local/avatars;
      echo MinIO buckets ready;
      "

volumes:
  pgdata:
  minio_data:
  redis_data:
